<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ترب — Playground</title>
<style>
@font-face{font-family:'Vazirmatn';src:url('/pg/static/Vazirmatn-var.woff2') format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',sans-serif;direction:rtl;color:#1A1F36;font-size:14px;line-height:1.75;-webkit-font-smoothing:antialiased;min-height:100vh;
 background:radial-gradient(260px 220px at 82% 30%,rgba(255,218,228,.55),transparent 70%),radial-gradient(280px 260px at 12% 42%,rgba(214,222,255,.55),transparent 70%),radial-gradient(300px 260px at 75% 88%,rgba(234,224,255,.45),transparent 70%),#FCFCFE;background-attachment:fixed}
.wrap{max-width:1280px;margin:0 auto;padding:0 12px 120px}
.top{position:sticky;top:0;z-index:5;background:rgba(252,252,254,.88);backdrop-filter:blur(14px);padding:10px 4px 8px;border-bottom:1px solid #ECEDF3}
.trow{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}.brand img{width:30px;height:30px}
.spend{font-size:12px;color:#4E5368;background:#fff;border:1px solid #ECEDF3;border-radius:14px;padding:3px 10px}.spend b{color:#1A1F36}
.spend.warn{background:#FFF4E5;border-color:#FFD9A8}
.seg{display:flex;background:rgba(238,239,245,.85);border-radius:22px;padding:4px;margin-top:8px;box-shadow:inset 0 0 0 1px rgba(225,227,236,.7)}
.seg button{flex:1;border:0;background:none;font:inherit;padding:7px 4px;border-radius:18px;color:#9A9DAC;font-weight:500;font-size:14px;cursor:pointer}
.seg button.on{background:linear-gradient(180deg,#fff,#FFF5F6);color:#1A1F36;font-weight:800;box-shadow:0 4px 14px rgba(232,120,140,.14),0 1px 2px rgba(30,30,60,.06)}
.bar{display:flex;gap:6px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.btn{border:1px solid #E4E6F0;background:#fff;border-radius:14px;padding:3px 10px;font:inherit;font-size:12px;color:#5B6072;cursor:pointer}
.btn:hover{background:#F4F5F8}
.urow{display:flex;gap:10px;align-items:flex-start;margin:14px 0 10px}
.uav{width:32px;height:32px;border-radius:50%;background:#E9ECF8;color:#5E6683;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px}
.ububble{background:#EDF0FD;border-radius:22px;padding:9px 15px;font-size:14.5px;max-width:85%}
.arow{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.aav{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:#fff;box-shadow:0 4px 12px rgba(150,120,160,.18)}
.acol{flex:1;min-width:0}
.abubble{background:#F4F5F8;border-radius:22px;padding:10px 15px;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:1300px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.col3{background:rgba(255,255,255,.6);border:1px solid #ECEDF3;border-radius:20px;padding:10px}
.vtag{display:inline-block;font-weight:800;font-size:12.5px;background:#1A1F36;color:#fff;border-radius:10px;padding:1px 10px;margin-bottom:6px}
.vtag.current{background:#6B7280}.vtag.v3{background:#4F5BD5}.vtag.jev{background:#E8475B}.vtag.v3plus{background:#0E9F6E}
.metrics{display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px;color:#5B6072;margin:6px 0}
.metrics span{background:#fff;border:1px solid #ECEDF3;border-radius:10px;padding:1px 8px}
.eng{font-size:11px;color:#B45309}
.card{background:#fff;border-radius:22px;box-shadow:0 10px 34px rgba(40,44,90,.07),0 1px 3px rgba(40,44,90,.03);border:1px solid rgba(236,237,243,.8)}
.pcard{display:flex;gap:12px;padding:12px;margin:10px 0}
.tile{width:92px;height:110px;border-radius:18px;background:#F4F5F7;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tile img{width:100%;height:100%;object-fit:cover}
.pcol{flex:1;min-width:0}
.ttl{font-size:14px;font-weight:800;line-height:1.6}
.sub{font-size:11.5px;color:#8A8EA0}
.prange{font-size:12.5px;color:#4E5368;margin-top:5px}.prange b{font-weight:800;color:#1A1F36;font-size:13.5px}
.fresh{font-size:10.5px;color:#A3A6B4}
.note{font-size:12.5px;color:#4E5368;margin-top:5px;background:#F8F8FC;border-radius:12px;padding:5px 9px}
.flag{display:inline-block;font-size:11px;border-radius:9px;padding:0 7px;margin:3px 0 0 4px}
.flag.stale{background:#FFF4E5;color:#B45309}.flag.sus{background:#FDECEE;color:#C0263B}
.scard{padding:11px 13px;margin:8px 0}
.srow{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sname{font-weight:800}.price{font-weight:800;white-space:nowrap}
.addr{font-size:12px;color:#5B6072}
.meta{font-size:11px;color:#8A8EA0;display:flex;gap:8px;flex-wrap:wrap}
.btitle{font-size:12.5px;font-weight:800;color:#5B6072;margin:12px 4px 2px}
table.cmp{width:100%;border-collapse:collapse;font-size:12px}table.cmp td,table.cmp th{border-bottom:1px solid #F0F1F5;padding:6px;text-align:right;vertical-align:top}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid #E4E6F0;background:#fff;border-radius:16px;padding:4px 12px;font:inherit;font-size:12.5px;cursor:pointer;box-shadow:0 2px 8px rgba(60,60,110,.05)}
.step{display:flex;gap:8px;padding:8px 0;border-bottom:1px dashed #ECEDF3}.step:last-child{border:0}
.sn{width:24px;height:24px;border-radius:50%;background:#EDF0FD;color:#4F5BD5;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px}
details.dbg{margin-top:6px;font-size:11.5px}details.dbg summary{cursor:pointer;color:#8A8EA0}
details.dbg pre{direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;background:#1A1F36;color:#E5E7F0;border-radius:12px;padding:8px;max-height:420px;overflow:auto;font-size:11px;margin-top:4px}
.composer{position:fixed;bottom:0;left:0;right:0;padding:8px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(252,252,254,0),rgba(252,252,254,.96) 30%)}
.cbox{max-width:900px;margin:0 auto;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border:1px solid rgba(228,230,240,.9);box-shadow:0 12px 34px rgba(110,110,170,.12);border-radius:28px;padding:6px 8px 6px 6px}
.cbox input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:15px;padding:8px 10px;min-width:0}
.send{border:0;background:#E8475B;color:#fff;font:inherit;font-weight:800;border-radius:22px;padding:8px 18px;cursor:pointer}
.send:disabled{opacity:.5}
.hint{font-size:11px;color:#B45309;text-align:center;margin-bottom:4px}
.empty{color:#A6A9B7;text-align:center;margin:40px 0;font-size:13px}
.spin{color:#8A8EA0;font-size:12.5px;margin:8px 0}

/* ---- drill-down drawer / related / suggestions / memory (all $0, DB only) ---- */
[data-pid],[data-sid]{cursor:pointer}
.pcard[data-pid]{transition:box-shadow .15s,transform .15s}.pcard[data-pid]:hover{box-shadow:0 14px 38px rgba(40,44,90,.12);transform:translateY(-1px)}
.more{font-size:11.5px;color:#4F5BD5;font-weight:700;margin-top:4px}
.slink{color:#1A1F36;text-decoration:none;border-bottom:1px dashed #C9CCE0}
.rel{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.rel::-webkit-scrollbar{height:6px}.rel::-webkit-scrollbar-thumb{background:#E4E6F0;border-radius:6px}
.rcard{flex:0 0 150px;scroll-snap-align:start;padding:9px;border-radius:18px}
.rcard .tile{width:100%;height:96px;border-radius:14px;margin-bottom:6px}
.rcard .ttl{font-size:12px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:37px}
.rcard .prange{font-size:12px;margin-top:3px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.sugg .chip{background:linear-gradient(180deg,#fff,#F7F8FF);border-color:#DCE0F7;color:#3B44A8}
.sugg .chip::before{content:'↖ ';color:#A3A9E0}
.memrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:#8A8EA0}
.mchip{display:inline-flex;align-items:center;gap:4px;background:#F1F3FC;color:#4E5368;border-radius:12px;padding:1px 4px 1px 9px}
.mchip button{border:0;background:none;color:#A3A6B4;cursor:pointer;font:inherit;font-size:13px;line-height:1;padding:0 3px}
.mchip button:hover{color:#E8475B}
.dback{position:fixed;inset:0;background:rgba(26,31,54,.28);backdrop-filter:blur(2px);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.dback.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(440px,100vw);background:#FCFCFE;z-index:21;box-shadow:-20px 0 60px rgba(40,44,90,.18);
 transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
@media(max-width:600px){.drawer{top:auto;width:100vw;height:88vh;border-radius:24px 24px 0 0;transform:translateY(105%)}.drawer.on{transform:none}}
.dhead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #ECEDF3}
.dhead .dt{flex:1;font-weight:800;font-size:14.5px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ib{border:0;background:#F1F2F7;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px;color:#4E5368;flex-shrink:0}
.dbody{overflow-y:auto;padding:12px 14px 30px;flex:1}
.dsum{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.dsum .tile{width:72px;height:80px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;margin:6px 0}.kv dt{color:#8A8EA0}.kv dd{color:#1A1F36}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.stats span{background:#fff;border:1px solid #ECEDF3;border-radius:10px;padding:1px 8px;font-size:11.5px;color:#4E5368}
.disc{font-size:11.5px;color:#6B7080;background:#F4F5FB;border-radius:12px;padding:6px 10px;margin:8px 0}
.orow{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid #F0F1F5}
.orow.dim{opacity:.72}
.orow .sname{font-size:13px}
.orow .sub{font-size:11px}
.oprice{text-align:left;white-space:nowrap}.oprice b{font-size:13.5px}
.unk{color:#A3A6B4}
.hours{width:100%;border-collapse:collapse;font-size:12.5px}.hours td{padding:3px 4px;border-bottom:1px solid #F3F4F8}.hours tr.today td{font-weight:800;color:#4F5BD5}
.sec{font-size:12.5px;font-weight:800;color:#5B6072;margin:14px 0 4px}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 0 8px;margin-top:8px}
.gal img{flex:0 0 auto;height:118px;max-width:170px;object-fit:contain;background:#fff;border:1px solid #ECEEF3;border-radius:12px;scroll-snap-align:start;padding:6px;cursor:zoom-in}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:6px 0}
.kv div{background:#F7F8FB;border-radius:10px;padding:6px 9px;font-size:12px}.kv b{display:block;color:#8A8EA0;font-weight:600;font-size:11px}
details.spec{border:1px solid #ECEEF3;border-radius:12px;margin:6px 0;background:#fff}
details.spec summary{cursor:pointer;padding:8px 11px;font-weight:700;font-size:12.5px;color:#3A3F52;list-style:none}
details.spec summary::after{content:'‹';float:left;transition:.2s;color:#A0A4B3}details.spec[open] summary::after{transform:rotate(-90deg)}
details.spec table{width:100%;border-collapse:collapse;font-size:12px}details.spec td{padding:6px 11px;border-top:1px solid #F1F2F6;vertical-align:top}
details.spec td:first-child{color:#7A7F92;width:38%}
.about{background:linear-gradient(180deg,#FBFAFF,#fff);border:1px solid #ECE8FB;border-radius:14px;padding:10px 12px;margin:10px 0}
.about p{margin:4px 0;font-size:13px;line-height:1.9;color:#2E3242}.about .srcs{margin-top:6px;font-size:11px;color:#9AA0B2}
.about .srcs a{color:#8C86B8;text-decoration:none;margin-left:8px}.proute{display:inline-block;font-size:11px;color:#6B5BD2;background:#F1EEFF;border:1px solid #E1DBFF;border-radius:999px;padding:2px 10px;margin:0 0 6px}.about sup.ref{color:#8C86B8;font-size:10px}.about.loading .spin{font-size:12px;color:#9AA0B2;padding:6px 0}.about .srcs a:hover{text-decoration:underline}
.pill{display:inline-block;background:#F1F3FC;border-radius:10px;padding:0 8px;margin:2px;font-size:11.5px;color:#4E5368}
.maplink{display:inline-block;margin-top:6px;background:#EDF0FD;color:#3B44A8;border-radius:12px;padding:4px 12px;text-decoration:none;font-size:12.5px;font-weight:700}
.derr{text-align:center;padding:30px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}.derr-ic{font-size:30px}.derr-t{font-weight:700;font-size:14px;line-height:1.8}
.fake{font-size:11px;color:#B45309;background:#FFF4E5;border-radius:8px;padding:0 6px;margin-right:4px}

/* ---- clarifying question cards ---- */
.qwrap{margin:10px 0 4px;display:flex;flex-direction:column;gap:8px}
.qcard{padding:11px 13px;border-radius:18px}
.qt{font-weight:800;font-size:13.5px;margin-bottom:6px}
.qopts{display:flex;flex-wrap:wrap;gap:6px}
.qo{border:1px solid #E4E6F0;background:#fff;border-radius:16px;padding:4px 12px;font:inherit;font-size:12.5px;cursor:pointer;color:#3E4357}
.qo.on{background:#1A1F36;border-color:#1A1F36;color:#fff}
.qin{margin-top:7px;width:100%;border:1px solid #E4E6F0;border-radius:12px;padding:6px 10px;font:inherit;font-size:13px;outline:0;background:#FBFBFE}
.qin:focus{border-color:#B9BFEA}
.qsend{align-self:flex-start;border:0;background:#E8475B;color:#fff;font:inherit;font-weight:800;border-radius:16px;padding:6px 16px;cursor:pointer;font-size:13px}
.qsend:disabled{opacity:.45;cursor:default}
.qdone{font-size:11.5px;color:#8A8EA0}

/* ---- saved lists / basket ---- */
.pcard,.rcard{position:relative}
.savebtn{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;border:1px solid #ECEDF3;background:rgba(255,255,255,.92);cursor:pointer;font-size:15px;line-height:1;color:#8A8EA0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(40,44,90,.08);z-index:2}
.savebtn:hover{color:#E8475B;border-color:#F6C9D0}
.savebtn.on{color:#E8475B}
.savebtn.inl{position:static;width:26px;height:26px;font-size:13px;margin-top:4px;display:inline-flex}
.listbtn{white-space:nowrap;border:1px solid #E4E6F0;background:#fff;border-radius:14px;padding:3px 12px;font:inherit;font-size:12.5px;cursor:pointer;color:#1A1F36;font-weight:700}
.listbtn b{background:#E8475B;color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-right:4px}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%) translateY(20px);background:#1A1F36;color:#fff;border-radius:16px;padding:8px 16px;font-size:13px;z-index:40;opacity:0;transition:all .2s;pointer-events:none;max-width:92vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.ltabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ltab{border:1px solid #E4E6F0;background:#fff;border-radius:16px;padding:3px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.ltab.on{background:#1A1F36;color:#fff;border-color:#1A1F36}
.lhead{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.lhead .ln{font-weight:800;font-size:15px;flex:1}
.lhead input{flex:1;font:inherit;font-size:14px;border:1px solid #DCE0F7;border-radius:10px;padding:4px 8px}
.ltot{display:flex;justify-content:space-between;align-items:center;background:#F4F5FB;border-radius:14px;padding:8px 12px;margin:6px 0 10px}
.ltot b{font-size:15px}
.lrow{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid #F0F1F5;align-items:flex-start}
.lrow .tile{width:52px;height:58px;border-radius:12px}
.lrow .lc{flex:1;min-width:0}
.lact{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.lact select{font:inherit;font-size:11.5px;border:1px solid #E4E6F0;border-radius:8px;padding:1px 4px;background:#fff}
.mini{border:0;background:#F1F2F7;border-radius:10px;padding:2px 9px;font:inherit;font-size:11.5px;cursor:pointer;color:#4E5368}
.mini:hover{background:#E7E9F2}
#lmap{height:220px;border-radius:16px;margin:8px 0;overflow:hidden;background:#EEF0F6}
.hook{background:linear-gradient(180deg,#FFF5F6,#fff)!important;border-color:#F6C9D0!important;color:#C0263B!important}
.hook::before{content:'＋ '!important;color:#E8475B!important}

/* ---- «بورس این کالا» ---- */
.proj{padding:12px 14px;margin:10px 0;border-radius:20px;background:linear-gradient(180deg,#FFFFFF,#FBF9FF)}
.proj .pt{font-weight:800;font-size:14.5px;color:#2B2F40}.proj .pa{font-size:12px;color:#7A7F92;margin:2px 0 8px}
.nrow{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid #F1F2F6}
.nrow.off{opacity:.45}.nrow input[type=checkbox]{width:17px;height:17px;accent-color:#E8475B}
.nrow .ni{font-weight:700;font-size:13px}.nrow .nw{font-size:11.5px;color:#8A8EA0}
.pri{font-size:10.5px;border-radius:8px;padding:0 6px;margin-right:4px;background:#EEF7F2;color:#0E9F6E}.pri.opt{background:#F3F4F8;color:#7A7F92}
.qty{display:flex;align-items:center;gap:4px;font-size:11.5px;color:#7A7F92;white-space:nowrap}.qty input{width:52px;border:1px solid #E3E5EC;border-radius:10px;padding:3px 6px;font:inherit;text-align:center}
.parea{width:100%;box-sizing:border-box;border:1px solid #E3E5EC;border-radius:12px;padding:6px 10px;font:inherit;font-size:12.5px;margin:8px 0}
.pgo{border:0;background:#E8475B;color:#fff;font:inherit;font-weight:800;border-radius:16px;padding:7px 18px;cursor:pointer}.pgo:disabled{opacity:.5}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 8px}.ptab{border:1px solid #E3E5EC;background:#fff;border-radius:14px;padding:5px 11px;font:inherit;font-size:12px;cursor:pointer;text-align:right}
.ptab.on{border-color:#E8475B;background:#FFF4F6;color:#C2334A}.ptab b{display:block;font-size:13px}
.pkpi{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.pkpi span{background:#F5F6FA;border-radius:10px;padding:3px 9px;font-size:12px}.pkpi b{color:#2B2F40}
.prow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-top:1px solid #F1F2F6;font-size:12.5px}
.prow .pp{font-weight:700;cursor:pointer}.prow .ps{color:#4F5BD5;cursor:pointer}.prow .pr{text-align:left;white-space:nowrap}
.pmap{height:190px;border-radius:14px;margin:6px 0;overflow:hidden;background:#F3F4F8;position:relative;z-index:0;isolation:isolate}
.nf{color:#B4232F;font-weight:700}.fresh.ok{color:#0E9F6E}
.bz{padding:11px 13px;margin:10px 0;border-radius:18px;background:linear-gradient(180deg,#FFFFFF,#F7F8FF)}
.bz .bzt{font-size:11.5px;color:#8A8EA0}.bz .bzh{font-weight:800;font-size:14.5px;margin:2px 0}
.bz .bzs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bz .bzs span{background:#fff;border:1px solid #E4E6F0;border-radius:12px;padding:1px 9px;font-size:12px;cursor:pointer}
</style></head><body>

// ---- robust fetch: timeout (AbortController), one retry for reads, pinggy no-screen header, typed errors ----
class NetErr extends Error{constructor(kind,msg){super(msg);this.kind=kind}}
async function req(path,{body,timeout=10000,retries=1}={}){
 const url=path+(path.includes('?')?'&':'?')+'token='+encodeURIComponent(TOKEN);let last;
 for(let a=0;a<=retries;a++){const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),timeout);
  try{const r=await fetch(url,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Pinggy-No-Screen':'true'},body:body?JSON.stringify(body):undefined,signal:ac.signal,cache:'no-store'});
   const ct=r.headers.get('content-type')||'';
   if(!ct.includes('application/json')){clearTimeout(tm);throw new NetErr(r.ok?'interstitial':'dead','HTTP '+r.status+' '+ct)}
   const j=await r.json();clearTimeout(tm);
   if(!r.ok){if(r.status===402)return j;throw new NetErr(r.status===403?'auth':r.status===404?'notfound':'server',j.detail||j.error||('HTTP '+r.status))}
   return j}
  catch(e){clearTimeout(tm);last=e instanceof NetErr?e:(e.name==='AbortError'?new NetErr('timeout','timeout'):new NetErr('network',String(e&&e.message||e)));
   if(['auth','notfound'].includes(last.kind))break}
  if(a<retries)await new Promise(r=>setTimeout(r,700))}
 console.warn('request failed',path,last);throw last}
function errMsg(e){const k=e&&e.kind;return k==='network'||k==='dead'?'لینک عوض شده؛ صفحه را با لینک جدید باز کنید (لینک تازه هر ساعت عوض می‌شود).':k==='timeout'?'پاسخ سرور بیش از حد طول کشید.':k==='interstitial'?'صفحهٔ هشدار pinggy جلوی درخواست را گرفت؛ صفحه را یک بار تازه کنید.':k==='auth'?'توکن نامعتبر است؛ لینک کامل را باز کنید.':k==='notfound'?'این مورد در داده‌ها پیدا نشد.':'خطای سرور: '+String(e&&e.message||e).slice(0,120)}
async function api(p,b){try{return await req(p,{body:b,timeout:p==='/api/send'?90000:10000,retries:p==='/api/send'?0:1})}catch(e){return {error:errMsg(e),kind:e.kind}}}

 else if(b.type==='plan'){h+='<div class="btitle">برنامهٔ خرید</div><div class="card scard">'+b.steps.map((s,i)=>`<div class="step"><div class="sn">${fa(i+1)}</div><div>${s.shop?'<div class="sname"><span class="slink" data-sid="'+esc(s.shop.shop_id)+'">'+esc(s.shop.name)+'</span></div>'+shopLine(s.shop):''}${s.note?'<div>'+esc(s.note)+'</div>':''}</div></div>`).join('')+'</div>'}
 else if(b.type==='chips'){h+='<div class="chips">'+b.options.map(o=>`<button class="chip" data-chip="${esc(o)}">${esc(o)}</button>`).join('')+'</div>'}
}return h}

 if(vals.length){const x=vals.join(' و ');const f=QTPL[c.dataset.q]||QTPL[c.dataset.q.split('_')[0]]||(y=>y);ans.push({id:c.dataset.q,title:c.dataset.qtitle,answer:x,phrase:f(x)})}});return ans}

const PJ={};let PJN=0;
function projHTML(r){const P=r.project;if(!P||!P.needs)return'';if(!P._k){P._k='p'+(++PJN)}PJ[P._k]=r;const k=P._k;

function planHTML(P,k){const R=P.result;let h='';if(R.summary)h+=`<div class="abubble" style="margin-top:10px">${esc(R.summary)}</div>`;

document.addEventListener('click',e=>{if(e.target.closest('[data-dretry]')&&DRETRY){const f=DRETRY;DRETRY=null;DSTACK.pop();f()}});

// ---------------- saved lists / basket (no AI; user_lists.sqlite) ----------------
let CID=localStorage.getItem('pg_cid');if(!CID){CID='c'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('pg_cid',CID)}
let LISTS=null,CURL=null,SAVED=new Set();
function saveKey(pid,sid){return pid+'|'+(sid||'')}
function saveBtn(pid,sid,oid,inline){const on=SAVED.has(saveKey(pid,sid));return `<button class="savebtn${inline?' inl':''}${on?' on':''}" data-save="${esc(pid)}|${esc(sid||'')}|${esc(oid||'')}" title="ذخیره در لیست">${on?'♥':'♡'}</button>`}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function setLists(j){if(!j||!j.lists)return;LISTS=j.lists;if(!CURL||!LISTS.find(l=>l.list_id===CURL))CURL=LISTS[0].list_id;SAVED=new Set();let n=0;for(const l of LISTS)for(const it of l.items){SAVED.add(saveKey(it.product_id,it.shop_id));n++}
 document.getElementById('lcount').textContent=fa(n)}
async function loadLists(){try{setLists(await req('/api/lists?cid='+encodeURIComponent(CID)))}catch(e){}}
async function saveItem(pid,sid,oid,btn){try{const j=await req('/api/lists/items',{body:{cid:CID,product_id:pid,shop_id:sid,offer_id:oid,list_id:CURL},retries:0});setLists(j);
  const l=LISTS.find(x=>x.list_id===j.list_id);toast(j.already_saved?`قبلاً در «${l?l.name:''}» بود`:`به «${l?l.name:''}» اضافه شد`);if(btn&&btn.classList.contains('savebtn')){btn.classList.add('on');btn.textContent='♥'}
  if(document.getElementById('drawer').classList.contains('on')&&document.getElementById('dtitle').textContent==='لیست‌های من')showLists()}catch(e){toast(errMsg(e))}}
function listHTML(){const l=LISTS.find(x=>x.list_id===CURL);let h='<div class="ltabs">'+LISTS.map(x=>`<button class="ltab${x.list_id===CURL?' on':''}" data-lact="pick" data-id="${x.list_id}">${esc(x.name)} · ${fa(x.n_items)}</button>`).join('')+'<button class="ltab" data-lact="new">＋ لیست جدید</button></div>';
 h+=`<div class="lhead" id="lhead"><div class="ln">${esc(l.name)}</div><button class="mini" data-lact="rename" data-id="${l.list_id}">✎ تغییر نام</button>${LISTS.length>1?`<button class="mini" data-lact="del" data-id="${l.list_id}">حذف لیست</button>`:''}</div>`;
 h+=`<div class="ltot"><div><div class="sub">جمع ${fa(l.n_items)} قلم${l.n_unknown_price?' (قیمت '+fa(l.n_unknown_price)+' قلم نامشخص)':''}</div><b>${l.n_items?(l.total_toman?toman(l.total_toman):'نامشخص'):'—'}</b></div><button class="mini" data-lact="refresh" data-id="${l.list_id}">↻ بروزرسانی قیمت‌ها</button></div>`;
 if(!l.items.length)return h+'<div class="empty" style="margin:24px 0">هنوز چیزی ذخیره نشده. روی ♡ کارت‌ها یا ردیف فروشنده‌ها بزنید.</div>';
 h+=l.items.map(it=>`<div class="lrow"><div class="tile">${it.image?`<img src="${esc(it.image)}" onerror="this.remove()">`:''}</div><div class="lc"><div class="sname"><span class="slink" data-pid="${esc(it.product_id)}">${esc(it.title)}</span></div>
  <div class="sub">${it.shop?`<span class="slink" data-sid="${esc(it.shop.shop_id)}">${esc(it.shop.name)}</span> · ${U(it.shop.area)}`:'کمترین قیمت بین همهٔ فروشنده‌ها'}</div>
  <div class="prange"><b>${it.price_toman?toman(it.price_toman):'<span class="unk">نامشخص</span>'}</b>${it.qty>1?' × '+fa(it.qty):''} <span class="fresh">${esc(it.price_date_fa||'')}</span> ${labelPills(it.labels)}</div>
  <div class="lact">${LISTS.length>1?`<select data-move="${it.item_id}"><option value="">انتقال به…</option>${LISTS.filter(x=>x.list_id!==CURL).map(x=>`<option value="${x.list_id}">${esc(x.name)}</option>`).join('')}</select>`:''}<button class="mini" data-lact="rm" data-id="${it.item_id}">حذف</button>${it.shop&&it.shop.map_url?`<a class="mini" style="text-decoration:none" href="${esc(it.shop.map_url)}" target="_blank" rel="noopener">نقشه</a>`:''}</div></div></div>`).join('');
 if(l.shops.length)h+=`<div class="sec">فروشگاه‌های این لیست</div><div id="lmap"></div><div id="lmapfb" class="sub">${l.shops.map(sh=>`<div>• <a href="${esc(sh.map_url)}" target="_blank" rel="noopener">${esc(sh.name)}</a> · ${U(sh.area)} · ${fa(sh.n_items)} قلم</div>`).join('')}</div>`;
 return h+`<div class="disc">${esc('قیمت‌ها از داده‌های ترب؛ پیشنهاد ثبت‌شده؛ موجودی تضمین نیست')}</div>`}
function loadLeaflet(){return new Promise((ok,no)=>{if(window.L)return ok();const c=document.createElement('link');c.rel='stylesheet';c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(c);
 const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=()=>ok();s.onerror=()=>no();document.head.appendChild(s);setTimeout(()=>window.L?ok():no(),6000)})}
async function drawMap(){const l=LISTS.find(x=>x.list_id===CURL);const el=document.getElementById('lmap');if(!el||!l.shops.length)return;
 try{await loadLeaflet();if(!document.getElementById('lmap'))return;const m=L.map('lmap',{zoomControl:false,attributionControl:true});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);
  const pts=l.shops.map(sh=>[sh.lat,sh.lon]);l.shops.forEach(sh=>L.marker([sh.lat,sh.lon]).addTo(m).bindPopup(esc(sh.name)));if(pts.length===1)m.setView(pts[0],15);else m.fitBounds(pts,{padding:[24,24]})}
 catch(e){el.style.display='none'}}
async function showLists(push){if(!LISTS)await loadLists();if(!LISTS){dOpen('لیست‌های من','<div class="note">لیست‌ها بارگذاری نشد.</div>',push);return}
 if(document.getElementById('drawer').classList.contains('on')&&document.getElementById('dtitle').textContent==='لیست‌های من')dSet('لیست‌های من',listHTML());else dOpen('لیست‌های من',listHTML(),push);drawMap()}
async function listAction(a,id,el){try{let j;
 if(a==='pick'){CURL=id;return showLists()}
 if(a==='new'){j=await req('/api/lists',{body:{cid:CID,name:'لیست '+fa((LISTS||[]).length+1)},retries:0});setLists(j);CURL=j.created_list_id;showLists();return listAction('rename',CURL)}
 if(a==='rename'){const hd=document.getElementById('lhead');const l=LISTS.find(x=>x.list_id===id);hd.innerHTML=`<input id="lname" value="${esc(l.name)}" maxlength="40"><button class="mini" data-lact="rename_ok" data-id="${id}">ذخیره</button>`;const i=document.getElementById('lname');i.focus();i.select();i.onkeydown=e=>{if(e.key==='Enter')listAction('rename_ok',id)};return}
 if(a==='rename_ok'){j=await req('/api/lists/'+id+'/rename',{body:{cid:CID,name:document.getElementById('lname').value},retries:0})}
 if(a==='del'){if(!confirm('این لیست و همهٔ اقلامش حذف شود؟'))return;j=await req('/api/lists/'+id+'/delete',{body:{cid:CID},retries:0});CURL=null}
 if(a==='rm'){j=await req('/api/lists/items/'+id+'/delete',{body:{cid:CID},retries:0})}
 if(a==='refresh'){el.textContent='…';j=await req('/api/lists/'+id+'/refresh',{body:{cid:CID},retries:0});toast(j.changes&&j.changes.length?fa(j.changes.length)+' قیمت تغییر کرد':'قیمت‌ها به‌روزند (از داده‌ها)')}
 setLists(j);showLists()}catch(e){toast(errMsg(e))}}
document.addEventListener('change',async e=>{const m=e.target.closest('[data-move]');if(m&&m.value){try{setLists(await req('/api/lists/items/'+m.dataset.move+'/move',{body:{cid:CID,to_list_id:m.value},retries:0}));toast('منتقل شد');showLists()}catch(er){toast(errMsg(er))}}});
document.getElementById('listsbtn').onclick=()=>showLists(false);
loadLists();
api('/api/status').then(setStatus);api('/api/memory?sid='+encodeURIComponent(SID)+'&version=v3plus').then(j=>{MEM=j.chips||[];renderMem()});render();
</script></body></html>
